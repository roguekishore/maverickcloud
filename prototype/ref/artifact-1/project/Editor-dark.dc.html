<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Page editor, dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; height: 100vh; overflow: hidden; background: #0F0F11; font-family: Inter, system-ui, sans-serif; color: #EDEDEF">
<dc-import name="Main" dark="{{ yes }}" selected="b4" hint-size="100%,100vh"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
