<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Entry editor, mobile, dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #141416; font-family: Inter, system-ui, sans-serif; color: #EDEDEF">
<dc-import name="Collections" layout="mobile" height="844px" view="editor" entry="b-light" dark="{{ yes }}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
